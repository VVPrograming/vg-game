/* ---------- sound (synth, no assets) ---------- */
const Sfx={
  on:true,c:null,
  unlock(){
    try{
      if(!this.c){const A=window.AudioContext||window.webkitAudioContext;if(A){this.c=new A();const k=this.c.createDynamicsCompressor();k.connect(this.c.destination);this.m=k}}
      if(this.c&&this.c.state==='suspended')this.c.resume();
    }catch(e){}
  },
  t(f,d,vol,slide,at,type){
    const c=this.c;if(!this.on||!c||c.state!=='running')return;
    const s=c.currentTime+(at||0),o=c.createOscillator(),g=c.createGain();
    o.type=type||'triangle';o.frequency.setValueAtTime(f,s);
    if(slide)o.frequency.exponentialRampToValueAtTime(slide,s+d);
    g.gain.setValueAtTime(vol*3.4,s);g.gain.exponentialRampToValueAtTime(.0001,s+d);
    o.connect(g);g.connect(this.m);o.start(s);o.stop(s+d+.02);
  },
  move(){this.t(360,.08,.1,250)},
  merge(v){const f=330+Math.min(Math.log2(v),12)*30;this.t(f,.14,.14,f*1.5);this.t(f*1.5,.12,.08,0,.05)},
  spawn(){this.t(620,.06,.06,0,.1)},
  win(){[523,659,784,1047].forEach((f,i)=>this.t(f,.22,.16,0,i*.11))},

/* ---------- lock ---------- */
const LKEY='g2048.lock',RKEY='g2048.req',DEV_SECRET='__DEV_SECRET__';
let lockCfg=null;
try{lockCfg=JSON.parse(localStorage.getItem(LKEY))}catch(e){}
const lk={on:false,mode:'unlock',type:'pin',buf:'',first:'',msg:'',then:'',busy:false,pat:[],px:0,py:0,drag:false,hidAt:0,req:''};
let nx=0,ny=0;
function hasLock(){return !!(lockCfg&&lockCfg.h)}
function usePat(){return lk.mode!=='forgot'&&lk.type==='pat'}
function saveLock(){try{if(lockCfg)localStorage.setItem(LKEY,JSON.stringify(lockCfg));else localStorage.removeItem(LKEY)}catch(e){}}
async function sha(str){
  try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));return Array.from(new Uint8Array(b),x=>x.toString(16).padStart(2,'0')).join('')}
  catch(e){let h=5381;for(let i=0;i<str.length;i++)h=((h<<5)+h+str.charCodeAt(i))|0;return 'x'+h}
}
async function recCode(req){
  const e=new TextEncoder(),k=await crypto.subtle.importKey('raw',e.encode(DEV_SECRET),{name:'HMAC',hash:'SHA-256'},false,['sign']);
  const b=new Uint8Array(await crypto.subtle.sign('HMAC',k,e.encode(req)));
  const n=((b[0]<<24)|(b[1]<<16)|(b[2]<<8)|b[3])>>>0;
  return String(n%100000000).padStart(8,'0');
}
function bad(){Sfx.bad();try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}}
function lockStart(mode,then){
  lk.on=true;lk.mode=mode;lk.then=then||'';lk.buf='';lk.first='';lk.msg='';lk.busy=false;lk.drag=false;lk.pat.length=0;
  lk.type=hasLock()?lockCfg.t:'pin';
  menu=false;credOpen=false;invalidate();
}
function lockOff(){
  lk.on=false;
  for(let i=0;i<32;i++)if(pool[i].on){pool[i].s=true;pool[i].m=false}
  anim=true;t0=performance.now();invalidate();
}
async function submit(entry){
  const m=lk.mode,now=Date.now();
  try{
    if(m==='create'){lk.first=entry;lk.mode='confirm';lk.msg=''}
    else if(m==='confirm'){
      if(entry===lk.first){
        const sl=Math.random().toString(36).slice(2);
        lockCfg={t:lk.type,s:sl,h:await sha(sl+entry),f:0,u:0};saveLock();Sfx.tap();lockOff();
      }else{lk.mode='create';lk.first='';lk.msg='Did not match. Start again.';bad()}
    }else if(m==='unlock'){
      if(lockCfg.u>now)bad();
      else if(await sha(lockCfg.s+entry)===lockCfg.h){
        lockCfg.f=0;lockCfg.u=0;saveLock();
        if(lk.then==='change'){lk.mode='create';lk.then='settings';lk.msg=''}else lockOff();
      }else{
        lockCfg.f++;if(lockCfg.f>=5)lockCfg.u=now+30000*Math.min(8,lockCfg.f-4);
        saveLock();lk.msg='Wrong. Try again.';bad();
      }
    }else if(m==='forgot'){
      if(DEV_SECRET.length<8||DEV_SECRET.startsWith('__')){lk.msg='Recovery works in the Android app only.';bad()}
      else if(entry===await recCode(lk.req)){
        lockCfg=null;saveLock();try{localStorage.removeItem(RKEY)}catch(e){}
        lk.mode='create';lk.then='';lk.type='pin';lk.msg='Unlocked. Set a new lock.';Sfx.tap();
      }else{lk.msg='Wrong code.';bad()}
    }
  }catch(e){lk.msg='Something went wrong.';bad()}
  lk.buf='';lk.pat.length=0;lk.busy=false;invalidate();
}
function keyTap(i){
  if(lk.busy||i===9)return;
  const max=lk.mode==='forgot'?8:4;
  lk.msg='';
  if(i===11)lk.buf=lk.buf.slice(0,-1);
  else if(lk.buf.length<max)lk.buf+=(i<9?i+1:0);
  Sfx.tap();
  if(lk.buf.length===max){lk.busy=true;const b=lk.buf;setTimeout(()=>submit(b),140)}
  invalidate();
}
function node(i){nx=lpad.x+((i%3)+.5)*lpad.w/3;ny=lpad.y+((i/3|0)+.5)*lpad.h/3}
function addDot(x,y){
  const R=lpad.w/9;
  for(let i=0;i<9;i++){node(i);const dx=x-nx,dy=y-ny;if(dx*dx+dy*dy<R*R*1.7&&lk.pat.indexOf(i)<0){lk.pat.push(i);Sfx.tap();break}}
}
function lkDown(x,y){
  if(lk.busy)return;
  if(usePat()&&hit(lpad,x,y,0)){lk.msg='';lk.drag=true;lk.pat.length=0;lk.px=x;lk.py=y;addDot(x,y);invalidate()}
}
function lkMove(x,y){if(lk.drag){lk.px=x;lk.py=y;addDot(x,y);invalidate()}}
function lkUp(x,y){
  if(lk.drag){
    lk.drag=false;
    if(lk.pat.length>=4){lk.busy=true;submit(lk.pat.join('-'))}
    else{lk.msg='Connect at least 4 dots.';bad();lk.pat.length=0}
    invalidate();return;
  }
  if(lk.busy)return;
  if(lb1.on&&hit(lb1,x,y,6)){lkAct(lb1.a);return}
  if(lb2.on&&hit(lb2,x,y,6)){lkAct(lb2.a);return}
  if(!usePat()&&hit(lpad,x,y,0))keyTap(Math.min(3,((y-lpad.y)/(lpad.h/4))|0)*3+Math.min(2,((x-lpad.x)/(lpad.w/3))|0));
}
function lkAct(a){
  Sfx.tap();
  if(a==='type'){lk.type=lk.type==='pin'?'pat':'pin';lk.buf='';lk.msg=''}
  else if(a==='forgot'){
    lk.mode='forgot';lk.buf='';lk.msg='';
    try{lk.req=localStorage.getItem(RKEY)||''}catch(e){}
    if(lk.req.length!==8){lk.req=String(Math.floor(Math.random()*1e8)).padStart(8,'0');try{localStorage.setItem(RKEY,lk.req)}catch(e){}}
  }
  else if(a==='back'){lk.mode='unlock';lk.buf='';lk.msg=''}
  else if(a==='restart'){lk.mode='create';lk.first='';lk.buf='';lk.msg=''}
  else if(a==='skip'){
    if(!(lk.then==='settings'&&!hasLock())){lockCfg={off:1};saveLock()}
    lockOff();
  }
  else if(a==='cancel')lockOff();
  invalidate();
}

function save(){
  try{
    const b=new Array(16);
    for(let i=0;i<16;i++)b[i]=grid[i]?grid[i].v:0;
    localStorage.setItem(KEY,JSON.stringify({b,s:score,h:best,w:won}));
  }catch(e){}
}

/* ---------- logic ---------- */
function alloc(v,r,c){
  for(let i=0;i<32;i++){const t=pool[i];
    if(!t.on){t.on=true;t.v=v;t.r=t.fr=r;t.c=t.fc=c;t.m=t.d=t.s=false;grid[r*4+c]=t;return t}}
  return null;
}
function pos(d,k,p){ // d: 0 L,1 U,2 R,3 D ; k line, p index from destination edge
  if(d===0){pr=k;pc=p}else if(d===2){pr=k;pc=3-p}else if(d===1){pr=p;pc=k}else{pr=3-p;pc=k}
}
function spawn(){
  let n=0;
  for(let i=0;i<16;i++)if(!grid[i])free[n++]=i;
  if(!n)return;
  const i=free[(Math.random()*n)|0];
  const t=alloc(Math.random()<.9?2:4,(i>>2),i&3);
  if(t)t.s=true;
}
function canMove(){
  for(let r=0;r<4;r++)for(let c=0;c<4;c++){
    const t=grid[r*4+c];
    if(!t)return true;
    if(c<3&&grid[r*4+c+1]&&grid[r*4+c+1].v===t.v)return true;
    if(r<3&&grid[(r+1)*4+c]&&grid[(r+1)*4+c].v===t.v)return true;
  }
  return false;
}
function move(d){
  for(let i=0;i<32;i++){pool[i].m=false;pool[i].s=false}
  let moved=false,gain=0,mv=0;
  for(let k=0;k<4;k++){
    let w=0,last=null;
    for(let p=0;p<4;p++){
      pos(d,k,p);
      const t=grid[pr*4+pc];
      if(!t)continue;
      grid[pr*4+pc]=null;
      t.fr=t.r;t.fc=t.c;
      if(last&&!last.m&&last.v===t.v){
        t.r=last.r;t.c=last.c;t.d=true;
        last.v*=2;last.m=true;gain+=last.v;moved=true;if(last.v>mv)mv=last.v;
      }else{
        pos(d,k,w);
        t.r=pr;t.c=pc;grid[pr*4+pc]=t;
        if(t.r!==t.fr||t.c!==t.fc)moved=true;
        last=t;w++;
      }
    }
  }
  if(!moved)return false;
  score+=gain;
  if(score>best){if(best>0&&!credDone&&!credReady){credReady=true;Sfx.best()}best=score}
  spawn();
  if(!won){
    for(let i=0;i<16;i++)if(grid[i]&&grid[i].v>=2048){won=true;Sfx.win();msgUntil=performance.now()+2500;setTimeout(invalidate,2550);break}
  }
  over=!canMove();
  if(gain)Sfx.merge(mv);else Sfx.move();
  Sfx.spawn();
  if(over)Sfx.over();
  anim=true;t0=performance.now();
  save();
  return true;
}
function doMove(d){if(move(d))invalidate()}
function input(d){
  if(over||splash||menu||credOpen||lk.on)return;
  if(anim){pend=d;return} // single-slot buffer
  doMove(d);
}
function newGame(){
  for(let i=0;i<32;i++){pool[i].on=false;pool[i].d=false}
  grid.fill(null);
  score=0;over=false;won=false;anim=false;pend=-1;confirmUntil=0;credReady=false;credDone=false;
  spawn();spawn();

    }
    for(let i=0;i<9;i++){
      node(i);ctx.beginPath();ctx.arc(nx,ny,R,0,7);
      if(lk.pat.indexOf(i)>=0){ctx.fillStyle=T.hi;ctx.fill()}
      else{ctx.fillStyle=T.card;ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#8a86d0';ctx.stroke()}
    }
  }else{
    const kw=lpad.w/3,kh=lpad.h/4,r=Math.min(kw,kh)*.4;
    ctx.font='800 '+(r*.95|0)+'px '+FONT;
    for(let i=0;i<12;i++){
      if(i===9)continue;
      const kx=lpad.x+(i%3+.5)*kw,ky=lpad.y+((i/3|0)+.5)*kh;
      ctx.beginPath();ctx.arc(kx,ky,r,0,7);ctx.fillStyle=T.card;ctx.fill();
      ctx.fillStyle=i===11?'#b9b6ef':'#fff';ctx.fillText(i===11?'\u2190':String(i<9?i+1:0),kx,ky+r*.04);
    }
  }
}
function drawSplash(a){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.globalAlpha=a;ctx.fillStyle=T.bg;ctx.fillRect(0,0,W,H);
  const m=Math.min(W,H),s=m*.42,x=W/2-s/2,y=H*.45-s/2;
  rr(x,y,s,s,s*.2);ctx.fillStyle=T.board;ctx.fill();
  ctx.fillStyle=T.hi;ctx.font='900 '+(s*.55|0)+'px '+FONT;ctx.fillText('VG',W/2,y+s/2+s*.03);
  ctx.fillStyle='#a9a5e8';ctx.font='600 '+(m*.045|0)+'px '+FONT;ctx.fillText('Created By V.V. Programmer',W/2,y+s+m*.09);
  ctx.globalAlpha=1;
}
let raf=0;
function invalidate(){if(!raf)raf=requestAnimationFrame(frame)}
function frame(now){
  raf=0;
  let p=1,sa=0;
  if(splash){
    if(sT0<0)sT0=now;
    const e=now-sT0;
    if(e>=1800&&!popped){popped=true;for(let i=0;i<32;i++)if(pool[i].on)pool[i].s=true;anim=true;t0=now}
    if(e>=2100)splash=false;else sa=e<1800?1:1-(e-1800)/300;
  }
  if(anim){
    p=Math.max(0,(now-t0)/DUR);
    if(p>=1){
      p=1;anim=false;
      for(let i=0;i<32;i++){const t=pool[i];if(t.d){t.on=false;t.d=false}}
    }
  }
  draw(p,now);
  if(sa>0){drawSplash(sa);invalidate();return}
  if(anim)invalidate();
  else{
    if(pend>=0){const d=pend;pend=-1;if(!over)doMove(d)}
    if(credReady||credOpen)invalidate();
  }
}

/* ---------- touch ---------- */
let tid=null,sx=0,sy=0,fired=false;
function find(list){for(let i=0;i<list.length;i++)if(list[i].identifier===tid)return list[i];return null}
cv.addEventListener('touchstart',e=>{
  e.preventDefault();
  if(tid!==null)return;
  const t=e.changedTouches[0];
  tid=t.identifier;sx=t.clientX;sy=t.clientY;fired=false;tdown=performance.now();if(lk.on&&!splash)lkDown(sx-rx,sy-ry);
},{passive:false});
cv.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(lk.on&&!splash&&tid!==null){const q=find(e.changedTouches);if(q)lkMove(q.clientX-rx,q.clientY-ry);return}
  if(tid===null||fired||splash||menu||credOpen)return;
  const t=find(e.changedTouches);if(!t)return;
  const dx=t.clientX-sx,dy=t.clientY-sy,ax=Math.abs(dx),ay=Math.abs(dy);
  if(ax>=th&&ax>ay*1.25){fired=true;input(dx<0?0:2)}
  else if(ay>=th&&ay>ax*1.25){fired=true;input(dy<0?1:3)}
},{passive:false});
cv.addEventListener('touchend',e=>{
  e.preventDefault();
  Sfx.unlock();
  const t=find(e.changedTouches);if(!t)return;
  tid=null;
  if(lk.on&&!splash){lkUp(t.clientX-rx,t.clientY-ry);return}
  if(fired)return;
  if(Math.abs(t.clientX-sx)<th&&Math.abs(t.clientY-sy)<th)tap(sx-rx,sy-ry);
},{passive:false});
function tap(x,y){
  const now=performance.now();
  if(splash){sT0=now-1800;invalidate();return}
  if(credOpen){credNext();invalidate();return}
  if(menu){
    if(hit(sr,x,y,6)){Sfx.on=!Sfx.on;Sfx.tap();saveSet()}
    else if(hit(lr,x,y,6)){Sfx.tap();if(hasLock())lockStart('unlock','change');else lockStart('create','settings')}
    else if(instEv&&hit(ir,x,y,6))doInstall();
    else if(hit(dr,x,y,6)||!hit(mb,x,y,0)){menu=false;Sfx.tap()}
    else for(let i=0;i<4;i++)if(hit(tr[i],x,y,8)){applyTheme(i);Sfx.tap();break}
    invalidate();return;
  }
  if(hit(gb,x,y,10)){menu=true;Sfx.tap();invalidate();return}
  if(credReady&&!over&&hit(cr,x,y,6)){credReady=false;credDone=true;credOpen=true;credScene=0;credT=0;credLast=0;Sfx.tap();invalidate();return}
  if(hit(btn,x,y,8)){
    Sfx.tap();
    if(over||confirmUntil>now)newGame();
    else{confirmUntil=now+2000;invalidate();setTimeout(invalidate,2050)}
  }
}
cv.addEventListener('touchcancel',()=>{tid=null;lk.drag=false;lk.pat.length=0},{passive:true});
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('visibilitychange',()=>{if(document.hidden){lk.hidAt=Date.now();save();if(Sfx.c)Sfx.c.suspend()}else{if(hasLock()&&!lk.on&&Date.now()-lk.hidAt>30000)lockStart('unlock','');invalidate()}});
addEventListener('pagehide',save);
addEventListener('resize',resize);
addEventListener('orientationchange',()=>setTimeout(resize,100));
if(window.ResizeObserver)new ResizeObserver(resize).observe(cv);

/* ---------- boot ---------- */
try{const q=JSON.parse(localStorage.getItem(SK));if(q){Sfx.on=q.snd!==false;applyTheme(q.th>=0&&q.th<4?q.th|0:0)}}catch(e){}
if(!lockCfg)lockStart('create','');else if(hasLock())lockStart('unlock','');
const s=load();
best=(s&&+s.h)||0;
resize();
if(!restore(s))newGame();
anim=false;invalidate();
})();
</script>
</body>
