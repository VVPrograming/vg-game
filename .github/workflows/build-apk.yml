name: Build APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install
      - name: Inject recovery secret
        env:
          VG_SECRET: ${{ secrets.VG_SECRET }}
        run: sed -i "s/__DEV_SECRET__/${VG_SECRET}/" play/index.html
      - name: Inject developer mode
        env:
          VG_SECRET: ${{ secrets.VG_SECRET }}
          VG_DEVCODE: ${{ secrets.VG_DEVCODE }}
        run: |
          if [ -n "$VG_DEVCODE" ]; then
            HASH=$(python3 -c "import hashlib,os;print(hashlib.pbkdf2_hmac('sha256',os.environ['VG_DEVCODE'].encode(),('vg-dev-v1'+os.environ['VG_SECRET']).encode(),100000).hex())")
            sed -i "s/__DEV_HASH__/${HASH}/" play/index.html
          fi
          sed -i "s/__BUILD__/${{ github.run_number }}-${GITHUB_SHA::7}/" play/index.html
      - run: npx cap add android
      - name: Landscape and icons
        run: |
          sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml
          pip install pillow
          python tools/make_icons.py
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk vg-game.apk
          gh release create "v1.0.${{ github.run_number }}" vg-game.apk --title "VG game v1.0.${{ github.run_number }}" --notes "Download vg-game.apk on your Android phone and open it to install." --latest
